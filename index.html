<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materi Pondok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#0f1117;--ink-2:#3d4259;--ink-3:#7c829a;--ink-4:#b0b5c8;
  --bg:#f0f2f9;--surface:#fff;--surface-2:#f7f8fc;
  --border:#e3e6f0;--border-2:#d0d4e8;
  --primary:#4f46e5;--primary-light:#ede9fe;
  --good:#0d9f6e;--good-light:#ecfdf6;--good-border:#a7f0d6;
  --warn:#c27b17;--warn-light:#fffbeb;--warn-border:#fde68a;
  --bad:#dc2626;--bad-light:#fef2f2;--bad-border:#fecaca;
  --gold:#c8941a;--gold-light:#fef9ec;
  --radius:20px;--radius-md:14px;--radius-sm:10px;
  --font:'Plus Jakarta Sans',system-ui,sans-serif;
  --shadow-xs:0 1px 3px rgba(15,17,23,.06);
  --shadow-sm:0 2px 8px rgba(15,17,23,.08);
  --shadow-md:0 8px 32px rgba(15,17,23,.10);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:80px;}

/* HERO */
.hero{background:linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#4338ca 100%);padding:48px 20px 88px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");}
.hero-inner{max-width:880px;margin:0 auto;position:relative;}
.hero-eyebrow{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:5px 14px;font-size:11px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:.6px;text-transform:uppercase;margin-bottom:20px;backdrop-filter:blur(8px);}
.live-dot{width:7px;height:7px;border-radius:50%;background:#94a3b8;transition:background .4s;}
.live-dot.on{background:#34d399;animation:livepulse 2s infinite;}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5);}70%{box-shadow:0 0 0 8px rgba(52,211,153,0);}100%{box-shadow:0 0 0 0 rgba(52,211,153,0);}}
.hero h1{font-size:clamp(26px,4.5vw,42px);font-weight:800;color:#fff;line-height:1.15;letter-spacing:-.5px;margin-bottom:6px;}
.hero h1 span{background:linear-gradient(90deg,#a5b4fc,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero-sub{font-size:14px;color:rgba(255,255,255,.55);margin-bottom:28px;font-weight:500;}
.hero-identity{display:inline-flex;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:var(--radius-md);backdrop-filter:blur(12px);overflow:hidden;flex-wrap:wrap;}
.hero-id-item{padding:13px 22px;display:flex;flex-direction:column;gap:3px;}
.hero-id-item+.hero-id-item{border-left:1px solid rgba(255,255,255,.15);}
.hero-id-label{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:rgba(255,255,255,.45);}
.hero-id-val{font-size:15px;font-weight:700;color:#fff;}
.hero-id-val.empty{color:rgba(255,255,255,.3);font-style:italic;font-size:14px;font-weight:400;}

/* ACTIONS */
.actions-bar{max-width:880px;margin:-32px auto 0;padding:0 20px;position:relative;z-index:10;display:flex;justify-content:flex-end;gap:8px;margin-bottom:20px;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .15s;font-family:var(--font);}
.btn:active{transform:scale(.96);}
.btn-export{background:var(--surface);color:var(--ink);border:1.5px solid var(--border-2);box-shadow:var(--shadow-sm);}
.btn-export:hover{background:var(--surface-2);border-color:var(--primary);color:var(--primary);}
.btn-export svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* MAIN */
.main{max-width:880px;margin:0 auto;padding:0 20px;}

/* SUMMARY */
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
.sum-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-md);padding:18px 20px;box-shadow:var(--shadow-xs);position:relative;overflow:hidden;}
.sum-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;border-radius:0 0 var(--radius-md) var(--radius-md);}
.sum-card.c-total::after{background:var(--primary);}
.sum-card.c-pct::after{background:var(--good);}
.sum-card.c-pct.warn-st::after{background:var(--warn);}
.sum-card.c-pct.bad-st::after{background:var(--bad);}
.sum-card.c-done::after{background:var(--gold);}
.sum-label{font-size:10px;font-weight:700;color:var(--ink-4);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.sum-val{font-size:28px;font-weight:800;color:var(--ink);}
.sum-val.g{color:var(--good);}
.sum-val.w{color:var(--warn);}
.sum-val.b{color:var(--bad);}
.sum-val.gold{color:var(--gold);}
.sum-sub{font-size:12px;color:var(--ink-4);margin-top:3px;font-weight:500;}

/* SECTION LABEL */
.sec-label{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border);}

/* MATERI CARDS */
.materi-list{display:flex;flex-direction:column;gap:10px;}
.materi-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-xs);overflow:hidden;transition:box-shadow .2s,border-color .2s;}
.materi-card:hover{box-shadow:var(--shadow-sm);}
.materi-card.open{border-color:var(--border-2);box-shadow:var(--shadow-md);}

.materi-header{display:flex;align-items:center;gap:12px;padding:15px 18px;cursor:pointer;user-select:none;}
.materi-icon{width:38px;height:38px;flex-shrink:0;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--primary-light);}
.materi-info{flex:1;min-width:0;}
.materi-nama{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.materi-meta{font-size:12px;color:var(--ink-3);margin-top:2px;font-weight:500;}
.pct-chip{flex-shrink:0;font-size:13px;font-weight:800;padding:5px 12px;border-radius:99px;}
.pct-chip.good{background:var(--good-light);color:var(--good);border:1px solid var(--good-border);}
.pct-chip.warn{background:var(--warn-light);color:var(--warn);border:1px solid var(--warn-border);}
.pct-chip.bad{background:var(--bad-light);color:var(--bad);border:1px solid var(--bad-border);}
.chevron{width:17px;height:17px;flex-shrink:0;stroke:var(--ink-4);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s cubic-bezier(.4,0,.2,1);}
.materi-card.open .chevron{transform:rotate(180deg);}

.prog-track{height:4px;background:var(--bg);margin:0 18px;}
.prog-fill{height:100%;border-radius:2px;transition:width .5s;}
.prog-fill.good{background:linear-gradient(90deg,var(--good),#34d399);}
.prog-fill.warn{background:linear-gradient(90deg,var(--warn),#fbbf24);}
.prog-fill.bad{background:linear-gradient(90deg,var(--bad),#f87171);}

/* BAB TABLE */
.bab-section{border-top:1.5px solid var(--border);background:var(--surface-2);display:none;}
.materi-card.open .bab-section{display:block;}
.bab-table{width:100%;border-collapse:collapse;}
.bab-table thead tr{border-bottom:1.5px solid var(--border);}
.bab-table th{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-4);padding:9px 14px;text-align:left;}
.bab-table th:not(:first-child){text-align:center;}
.bab-table td{padding:9px 14px;font-size:13px;border-bottom:1px solid #edf0f8;font-weight:500;color:var(--ink-2);}
.bab-table tr:last-child td{border-bottom:none;}
.bab-table td:not(:first-child){text-align:center;}
.bab-nama-cell{display:flex;align-items:center;gap:8px;}
.bab-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.bab-dot.good{background:var(--good);}
.bab-dot.warn{background:var(--warn);}
.bab-dot.bad{background:var(--bad);}

/* Stat pills in bab table */
.stat-pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;}
.stat-pill.total{background:#f0f2f9;color:var(--ink-2);}
.stat-pill.terisi{background:var(--good-light);color:var(--good);}
.stat-pill.belum{background:var(--bad-light);color:var(--bad);}
.stat-pill.belum.zero{background:#f0f2f9;color:var(--ink-4);}

.pct-inline{display:inline-flex;align-items:center;gap:5px;}
.mini-track{width:52px;height:4px;background:var(--border);border-radius:2px;display:inline-block;vertical-align:middle;overflow:hidden;}
.mini-fill{height:100%;border-radius:2px;}
.mini-fill.good{background:var(--good);}
.mini-fill.warn{background:var(--warn);}
.mini-fill.bad{background:var(--bad);}
.mini-num{font-size:12px;font-weight:800;}
.mini-num.good{color:var(--good);}
.mini-num.warn{color:var(--warn);}
.mini-num.bad{color:var(--bad);}

/* EMPTY / LOADING */
.state-box{text-align:center;padding:72px 20px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-md);}
.state-icon{font-size:40px;margin-bottom:14px;}
.state-title{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:6px;}
.state-sub{font-size:14px;color:var(--ink-3);}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* STATUS PILL */
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:6px 13px;border-radius:99px;position:fixed;bottom:24px;right:24px;z-index:100;box-shadow:var(--shadow-md);transition:all .3s;font-family:var(--font);}
.btn-excel-fixed{position:fixed;bottom:24px;left:24px;z-index:100;display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:var(--font);background:#16a34a;color:#fff;box-shadow:var(--shadow-md);transition:all .15s;}
.btn-excel-fixed:hover{background:#15803d;transform:translateY(-1px);box-shadow:0 12px 36px rgba(22,163,74,.25);}
.btn-excel-fixed:active{transform:scale(.96);}
.btn-excel-fixed svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.status-pill.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;}
.status-pill.loading{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;}
.status-pill.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;}
.sdot{width:6px;height:6px;border-radius:50%;}
.status-pill.ok .sdot{background:#10b981;}
.status-pill.loading .sdot{background:#3b82f6;animation:pulse 1s infinite;}
.status-pill.error .sdot{background:#ef4444;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

@media(max-width:620px){
  .summary-grid{grid-template-columns:repeat(2,1fr);}
  .hero{padding:36px 16px 72px;}
  .hero-id-item+.hero-id-item{border-left:none;border-top:1px solid rgba(255,255,255,.15);}
  .actions-bar,.main{padding:0 14px;}
  .bab-table th,.bab-table td{padding:8px 10px;}
  .status-pill{bottom:14px;right:14px;}
}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-eyebrow">
      <span class="live-dot" id="liveDot"></span>
      <span id="eyebrowTxt">Menghubungkan…</span>
    </div>
    <h1>Progres <span>Materi Pondok</span></h1>
    <p class="hero-sub">Pantauan presentasi belajar · diperbarui secara langsung</p>
    <div class="hero-identity">
      <div class="hero-id-item">
        <div class="hero-id-label">Nama</div>
        <div class="hero-id-val empty" id="idNama">—</div>
      </div>
      <div class="hero-id-item">
        <div class="hero-id-label">Kelas</div>
        <div class="hero-id-val empty" id="idKelas">—</div>
      </div>
      <div class="hero-id-item">
        <div class="hero-id-label">Diperbarui</div>
        <div class="hero-id-val" id="idUpdated" style="font-size:13px;">—</div>
      </div>
    </div>
  </div>
</div>

<div class="actions-bar">
  <button class="btn btn-export" onclick="exportHtml()">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Ekspor HTML
  </button>
</div>

<div class="main">
  <div class="summary-grid" id="summaryGrid" style="display:none">
    <div class="sum-card c-total">
      <div class="sum-label">Total Materi</div>
      <div class="sum-val" id="sumTotal">0</div>
      <div class="sum-sub">materi terdaftar</div>
    </div>
    <div class="sum-card c-pct" id="sumPctCard">
      <div class="sum-label">Progres Keseluruhan</div>
      <div class="sum-val g" id="sumPct">0%</div>
      <div class="sum-sub" id="sumPctSub">dari total halaman</div>
    </div>
    <div class="sum-card c-done">
      <div class="sum-label">Materi Selesai</div>
      <div class="sum-val gold" id="sumDone">0</div>
      <div class="sum-sub">materi 100%</div>
    </div>
  </div>

  <div class="sec-label">Daftar Materi</div>
  <div class="materi-list" id="materiList">
    <div class="state-box">
      <div class="spinner"></div>
      <div class="state-title">Memuat data…</div>
      <div class="state-sub">Mengambil data dari server</div>
    </div>
  </div>
</div>

<button class="btn-excel-fixed" onclick="exportXlsx()">
  <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
  Ekspor Excel
</button>

<div class="status-pill loading" id="statusPill">
  <span class="sdot"></span>
  <span id="statusTxt">Memuat…</span>
</div>

<script>
const SUPA_URL = 'https://siinsjpvzwrriqwrbgpd.supabase.co';
const SUPA_KEY = 'sb_publishable_SBjBS9QsXaruioOpKDtSVg_URP59zAw';
const _sb = supabase.createClient(SUPA_URL, SUPA_KEY);

let appData  = [];
let appIdent = {nama:'',kelas:''};
let lastUpd  = null;
let openMap  = {};

const calcPct = (h,s) => {
  h=Number(h)||0; s=Math.min(Math.max(Number(s)||0,0),h);
  return h<=0?0:Math.round(((h-s)/h)*100);
};
const rowTot = row => (row.bab||[]).reduce((a,b)=>{
  const bh=Number(b.halaman)||0;
  const bs=Math.min(Math.max(Number(b.sisa)||0,0),bh);
  return {h:a.h+bh, s:a.s+bs};
},{h:0,s:0});
const cls = pct => pct>=80?'good':pct>=40?'warn':'bad';
const fmtTime = iso => {
  if(!iso) return '—';
  return new Date(iso).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
};
const ICONS = ['📖','✏️','🔬','🌍','🕌','📐','🎨','🏛️','💡','📚'];
const getIcon = i => ICONS[i % ICONS.length];

function setStatus(msg,state='ok'){
  const p=document.getElementById('statusPill');
  p.className='status-pill '+state;
  document.getElementById('statusTxt').textContent=msg;
}

function render(){
  // Identity
  const nama  = appIdent.nama  || '';
  const kelas = appIdent.kelas || '';
  const nEl=document.getElementById('idNama');
  const kEl=document.getElementById('idKelas');
  nEl.textContent = nama  || '—';
  kEl.textContent = kelas || '—';
  nEl.className = 'hero-id-val'+(nama?'':' empty');
  kEl.className = 'hero-id-val'+(kelas?'':' empty');
  document.getElementById('idUpdated').textContent = fmtTime(lastUpd);

  // Summary
  if(appData.length>0){
    document.getElementById('summaryGrid').style.display='grid';
    const gT = appData.reduce((a,r)=>{const t=rowTot(r);return{h:a.h+t.h,s:a.s+t.s};},{h:0,s:0});
    const gPct = calcPct(gT.h, gT.s);
    const done = appData.filter(r=>{const t=rowTot(r);return calcPct(t.h,t.s)>=100;}).length;
    document.getElementById('sumTotal').textContent = appData.length;
    document.getElementById('sumDone').textContent  = done;
    const pEl = document.getElementById('sumPct');
    const c = cls(gPct);
    pEl.textContent = gPct+'%';
    pEl.className   = 'sum-val '+(c==='good'?'g':c==='warn'?'w':'b');
    const pc = document.getElementById('sumPctCard');
    pc.className = 'sum-card c-pct'+(gPct<80?(gPct<40?' bad-st':' warn-st'):'');
  }

  // Materi
  const list = document.getElementById('materiList');
  if(appData.length===0){
    list.innerHTML=`<div class="state-box"><div class="state-icon">📭</div>
      <div class="state-title">Belum ada data</div>
      <div class="state-sub">Data akan muncul otomatis saat tersedia di kertas pantau.</div></div>`;
    return;
  }

  list.innerHTML = appData.map((row,i)=>{
    const t   = rowTot(row);
    const pct = calcPct(t.h, t.s);
    const c   = cls(pct);
    const isOpen = openMap[row.id]||false;

    const babRows = (row.bab||[]).map(b=>{
      const bh  = Number(b.halaman)||0;
      const bs  = Math.min(Math.max(Number(b.sisa)||0,0),bh);
      const bte = bh - bs;   // terisi
      const bp  = calcPct(bh,bs);
      const bc  = cls(bp);
      return `<tr>
        <td><div class="bab-nama-cell"><span class="bab-dot ${bc}"></span>${b.nama||''}</div></td>
        <td><span class="stat-pill total">${bh}</span></td>
        <td><span class="stat-pill terisi">${bte}</span></td>
        <td><span class="stat-pill belum${bs===0?' zero':''}">${bs}</span></td>
        <td>
          <div class="pct-inline">
            <span class="mini-track"><span class="mini-fill ${bc}" style="width:${bp}%"></span></span>
            <span class="mini-num ${bc}">${bp}%</span>
          </div>
        </td>
      </tr>`;
    }).join('');

    const totalBab = (row.bab||[]).length;
    const terisiTotal = t.h - t.s;

    return `<div class="materi-card${isOpen?' open':''}" id="mc-${row.id}">
      <div class="materi-header" onclick="toggle('${row.id}')">
        <div class="materi-icon">${getIcon(i)}</div>
        <div class="materi-info">
          <div class="materi-nama">${row.nama||'(tanpa nama)'}</div>
          <div class="materi-meta">${totalBab} bab · ${terisiTotal}/${t.h} hal terisi</div>
        </div>
        <span class="pct-chip ${c}">${pct}%</span>
        <svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="prog-track"><div class="prog-fill ${c}" style="width:${pct}%"></div></div>
      <div class="bab-section">
        <table class="bab-table">
          <thead><tr>
            <th>Bab</th>
            <th>Semua Hal.</th>
            <th>Sudah Terisi</th>
            <th>Belum Terisi</th>
            <th>Presentasi</th>
          </tr></thead>
          <tbody>${babRows}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');
}

function toggle(id){
  openMap[id]=!openMap[id];
  const el=document.getElementById('mc-'+id);
  if(el) el.className='materi-card'+(openMap[id]?' open':'');
}

async function loadData(){
  setStatus('Memuat data…','loading');
  try{
    const {data:rows,error} = await _sb.from('progres_materi').select('*').limit(1);
    if(error) throw error;
    if(rows && rows.length>0){
      const row = rows[0];
      lastUpd = row.updated_at;
      if(Array.isArray(row.data) && row.data.length>0) appData = row.data;
      // Ambil identitas dari kolom identity
      if(row.identity && (row.identity.nama || row.identity.kelas)){
        appIdent = row.identity;
      }
    }
    render();
    document.getElementById('liveDot').className='live-dot on';
    document.getElementById('eyebrowTxt').textContent='Data Langsung';
    setStatus('Live · '+fmtTime(lastUpd),'ok');
  } catch(e){
    document.getElementById('eyebrowTxt').textContent='Koneksi Gagal';
    setStatus('Gagal memuat data','error');
    document.getElementById('materiList').innerHTML=`<div class="state-box">
      <div class="state-icon">⚠️</div>
      <div class="state-title">Gagal memuat data</div>
      <div class="state-sub">Periksa koneksi internet lalu refresh halaman.</div></div>`;
    console.error(e);
  }
}

function subscribe(){
  _sb.channel('pondok-viewer')
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'progres_materi'},payload=>{
      const n = payload.new;
      if(Array.isArray(n?.data)) appData = n.data;
      if(n?.identity && (n.identity.nama||n.identity.kelas)) appIdent = n.identity;
      if(n?.updated_at) lastUpd = n.updated_at;
      render();
      setStatus('Diperbarui · '+fmtTime(lastUpd),'ok');
    })
    .subscribe();
}

function exportXlsx(){
  try{
    if(typeof XLSX === 'undefined'){ alert('Library Excel belum termuat, coba refresh halaman.'); return; }
    if(!appData || appData.length===0){ alert('Belum ada data untuk diekspor.'); return; }

    const nama  = appIdent.nama  || '-';
    const kelas = appIdent.kelas || '-';

    // Bangun data sebagai array of arrays (string semua, hindari bug indexOf)
    const rows = [];

    // Baris identitas
    rows.push(['Nama :', nama, 'Kelas :', kelas, '', '']);
    rows.push(['', '', '', '', '', '']);

    // Header
    rows.push(['Materi / Bab', 'Semua Halaman', 'Sudah Terisi', 'Belum Terisi', 'Presentasi (%)', '']);

    // Data materi & bab
    appData.forEach(row => {
      const t = rowTot(row);
      const pct = calcPct(t.h, t.s);
      const terisi = t.h - t.s;

      // Baris materi
      rows.push([String(row.nama||''), String(t.h), String(terisi), String(t.s), pct+'%', '']);

      // Baris bab
      (row.bab||[]).forEach(b => {
        const bh = Number(b.halaman)||0;
        const bs = Math.min(Math.max(Number(b.sisa)||0,0),bh);
        const bt = bh - bs;
        const bp = calcPct(bh, bs);
        rows.push(['  '+String(b.nama||''), String(bh), String(bt), String(bs), bp+'%', '']);
      });

      // Subtotal
      rows.push(['', '↳ Total '+String(row.nama||''), '', '', pct+'%', '']);
    });

    // Grand total
    const gT   = appData.reduce((a,r)=>{ const t=rowTot(r); return {h:a.h+t.h,s:a.s+t.s}; },{h:0,s:0});
    const gPct = calcPct(gT.h, gT.s);
    rows.push(['Total Keseluruhan', String(gT.h), String(gT.h-gT.s), String(gT.s), gPct+'%', '']);

    // Buat worksheet dari plain array
    const ws = XLSX.utils.aoa_to_sheet(rows);

    // Terapkan style manual per cell
    const C_HEADER = '4F46E5'; const C_MATERI = 'EDE9FE'; const C_TOTAL = 'ECFDF6';
    const C_GOLD = 'FFD700';   const C_WHITE  = 'FFFFFF'; const C_LABEL = 'F7F8FC';
    const GOOD='0D9F6E'; const WARN='C27B17'; const BAD='DC2626';
    const INK='0F1117';  const SOFT='7C829A'; const GOLD_TXT='7A5800';

    function pctC(pct){ return pct>=80?GOOD:pct>=40?WARN:BAD; }

    function st(bold, bg, fg, align){
      return {
        font:{ bold:!!bold, color:{rgb:fg||INK}, sz:11 },
        fill:{ type:'pattern', patternType:'solid', fgColor:{rgb:bg||C_WHITE} },
        alignment:{ horizontal:align||'left', vertical:'center' },
        border:{
          top:{style:'thin',color:{rgb:'E3E6F0'}},
          bottom:{style:'thin',color:{rgb:'E3E6F0'}},
          left:{style:'thin',color:{rgb:'E3E6F0'}},
          right:{style:'thin',color:{rgb:'E3E6F0'}}
        }
      };
    }

    const alpha = ['A','B','C','D','E','F'];

    rows.forEach((row, ri) => {
      const rowLabel = rows[ri][0];
      const isHeader = ri === 2;
      const isIdent  = ri === 0;
      const isBlank  = ri === 1;
      const isTotal  = rowLabel === 'Total Keseluruhan';
      const isSubtot = rowLabel === '' && row[1].startsWith('↳');
      const isMateri = !isHeader && !isIdent && !isBlank && !isTotal && !isSubtot && row[1] !== '' && !String(row[0]).startsWith('  ');
      const isBab    = String(row[0]).startsWith('  ');

      row.forEach((val, ci) => {
        const ref = alpha[ci] + (ri + 1);
        if (!ws[ref]) ws[ref] = {};
        ws[ref].v = val;
        ws[ref].t = 's';

        if(isHeader){
          ws[ref].s = st(true, C_HEADER, 'FFFFFF', 'center');
          if(ci===0) ws[ref].s = st(true, C_HEADER, 'FFFFFF', 'left');
        } else if(isIdent){
          ws[ref].s = (ci===0||ci===2) ? st(true,C_LABEL,SOFT,'left') : st(false,C_WHITE,INK,'left');
        } else if(isBlank){
          ws[ref].s = st(false,C_WHITE,INK,'left');
        } else if(isTotal){
          const pct = parseInt(row[4])||0;
          ws[ref].s = st(true, C_TOTAL, ci===4?pctC(pct):INK, ci===0?'left':'center');
        } else if(isSubtot){
          const pct = parseInt(row[4])||0;
          ws[ref].s = st(true, C_GOLD, ci===1?GOLD_TXT:ci===4?pctC(pct):INK, ci===1?'left':'center');
        } else if(isMateri){
          const pct = parseInt(row[4])||0;
          const sisa = parseInt(row[3])||0;
          ws[ref].s = st(true, C_MATERI,
            ci===2?GOOD : ci===3?(sisa>0?BAD:GOOD) : ci===4?pctC(pct):INK,
            ci===0?'left':'center');
        } else if(isBab){
          const pct = parseInt(row[4])||0;
          const sisa = parseInt(row[3])||0;
          ws[ref].s = st(false, C_WHITE,
            ci===0?SOFT : ci===2?GOOD : ci===3?(sisa>0?BAD:GOOD) : ci===4?pctC(pct):INK,
            ci===0?'left':'center');
        }
      });
    });

    ws['!cols'] = [{wch:34},{wch:15},{wch:14},{wch:14},{wch:14},{wch:2}];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Progres Materi');

    const stamp = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, 'materi-pondok-'+stamp+'.xlsx', {bookType:'xlsx', cellStyles:true});

  } catch(e){
    console.error('Export Excel error:', e);
    alert('Gagal ekspor: '+e.message);
  }
}
